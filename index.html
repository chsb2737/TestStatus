<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Excel 테스트 현황 재확인</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --blue: #2f6fed;
    --blue-dark: #1d4fb8;
    --bg: #f4f6fb;
    --panel: #ffffff;
    --border: #dbe0ea;
    --text: #1f2430;
    --muted: #6b7280;
    --warn-bg: #fff7e6;
    --warn-text: #92600a;
    --err-bg: #fdecec;
    --err-text: #b3261e;
    --ok-bg: #eafaf0;
    --ok-text: #1e7a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(20, 30, 60, 0.06);
    width: 100%;
    max-width: 560px;
    padding: 28px 28px 24px;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
  }
  .row { margin-bottom: 16px; }
  label.field-label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .file-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    padding: 9px 16px;
    cursor: pointer;
    color: var(--text);
  }
  button:hover:not(:disabled) { background: #f0f3fa; }
  button.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: var(--blue-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #fileName {
    flex: 1;
    font-size: 13.5px;
    color: var(--text);
    padding: 9px 10px;
    background: #fafbfd;
    border: 1px dashed var(--border);
    border-radius: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .run-row { margin: 22px 0 14px; }
  .run-row-buttons {
    display: flex;
    gap: 10px;
  }
  .run-row-buttons button {
    flex: 1;
    padding: 12px 8px;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .run-row-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  #status {
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #log {
    max-height: 160px;
    overflow-y: auto;
    background: #fafbfd;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    display: none;
  }
  #log:not(:empty) { display: block; }
  .log-line { color: #374151; }
  .log-warn { color: var(--warn-text); }
  #resultBox {
    display: none;
    margin-top: 16px;
    background: var(--ok-bg);
    border: 1px solid #b7e4c7;
    border-radius: 10px;
    padding: 14px 16px;
  }
  #resultBox .ok-title {
    color: var(--ok-text);
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #resultFileName {
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    background: #fff;
    border: 1px solid #d7ecdf;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 6px 0 12px;
  }
  #downloadBtn { width: 100%; }
  #errorBox {
    display: none;
    margin-top: 14px;
    background: var(--err-bg);
    border: 1px solid #f3c2bf;
    color: var(--err-text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    white-space: pre-wrap;
  }
  .hint {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  #dropZone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    background: #fafbfd;
    padding: 22px 16px;
    text-align: center;
    margin-bottom: 12px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #dropZone .drop-title {
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 4px;
  }
  #dropZone .drop-or {
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0;
  }
  #dropZone.drag-active {
    border-color: var(--blue);
    background: #eef4ff;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Excel 테스트 현황 재확인</h1>
    <div class="subtitle">원본 파일은 수정하지 않고, 별도의 결과 파일을 새로 만듭니다.</div>

    <div class="row">
      <label class="field-label">1. 변경 전 Excel 파일 선택</label>
      <div id="dropZone">
        <div class="drop-title">Excel 파일을 여기에<br>드래그 앤 드롭하세요</div>
        <div class="drop-or">또는</div>
        <button id="pickBtn">Excel 파일 선택</button>
      </div>
      <div class="file-box">
        <span id="fileName">(선택된 파일 없음)</span>
      </div>
      <input type="file" id="fileInput" accept=".xlsx" style="display:none">
    </div>

    <div class="run-row">
      <div class="run-row-buttons">
        <button id="reconfirmBtn" class="primary" disabled>재확인 실행</button>
        <button id="nextBaseBtn" class="primary" disabled>다음 차수</button>
      </div>
      <div class="run-row-hint">파일을 선택하면 현재 차수에 맞춰 버튼 이름이 자동으로 바뀝니다.</div>
    </div>

    <div id="status">상태: 대기 중</div>
    <div id="log"></div>

    <div id="resultBox">
      <div class="ok-title">변환이 완료되었습니다.</div>
      <div class="field-label">결과 파일명</div>
      <div id="resultFileName"></div>
      <button id="downloadBtn" class="primary">결과 파일 다운로드</button>
    </div>

    <div id="errorBox"><strong>오류:</strong> <span id="errorText"></span></div>

    <div class="hint">
      이 페이지는 브라우저 안에서만 동작하며 파일을 어디로도 전송하지 않습니다.
      다운로드된 결과 파일은 내려받기(다운로드) 폴더에서 열어 확인해 주세요.
    </div>
  </div>

          log.push("[\uACBD\uACE0] \uC6CC\uD06C\uBD81\uC758 \uC790\uB3D9 \uD544\uD130 \uBC94\uC704 \uAC31\uC2E0 \uC911 \uBB38\uC81C\uAC00 \uBC1C\uC0DD\uD588\uC9C0\uB9CC \uBB34\uC2DC\uD558\uACE0 \uC9C4\uD589\uD569\uB2C8\uB2E4: " + e.message);
        }
        zip.file(sharedStringsPath, sharedStrings.serialize());
        zip.file(stylesPath, stylesManager.serialize());
        zip.file("xl/workbook.xml", newWorkbookXml);
        zip.file(pathOf(GWAJE_SHEET2), gwajeXml);
        zip.file(pathOf(ENV_SHEET2), envXml);
        for (const sheetName of ISSUE_SHEETS2) {
          zip.file(pathOf(sheetName), updatedSheetXml[pathOf(sheetName)]);
        }
        return { zip, log, nextRound, currentMaxRound };
      }
      async function detectCurrentRound2(arrayBuffer, JSZip) {
        const zip = await JSZip.loadAsync(arrayBuffer);
        const { map: sheetPathMap } = await getSheetPathMap(zip);
        const pathOf = (name) => sheetPathMap[xmlEscape(name)] || sheetPathMap[name];
        const path = pathOf("\uBB38\uC81C\uC810");
        if (!path)
          return null;
        const sheetFile = zip.file(path);
        const sstFile = zip.file("xl/sharedStrings.xml");
        if (!sheetFile || !sstFile)
          return null;
        const xml = await sheetFile.async("string");
        const sstXml = await sstFile.async("string");
        const sharedStrings = new U.SharedStrings(sstXml);
        const hp = B.detectHeaderInsertPoint(xml, sharedStrings);
        if (!hp || hp.baseRound === null || hp.baseRound === void 0)
          return null;
        return { baseRound: hp.baseRound, currentMaxRound: hp.round };
      }
      module.exports = { processWorkbook: processWorkbook2, detectCurrentRound: detectCurrentRound2, ISSUE_SHEETS: ISSUE_SHEETS2, GWAJE_SHEET: GWAJE_SHEET2, ENV_SHEET: ENV_SHEET2 };
    }
  });

  // core/browser-entry.js
  var { processWorkbook, detectCurrentRound, ISSUE_SHEETS, GWAJE_SHEET, ENV_SHEET } = require_main();
  window.ExcelReconfirm = { processWorkbook, detectCurrentRound, ISSUE_SHEETS, GWAJE_SHEET, ENV_SHEET };
})();

</script>
<script>
/* ===== UI 연결 ===== */
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const pickBtn = $("pickBtn");
  const fileInput = $("fileInput");
  const fileNameEl = $("fileName");
  const reconfirmBtn = $("reconfirmBtn");
  const nextBaseBtn = $("nextBaseBtn");
  const statusEl = $("status");
  const logEl = $("log");
  const resultBox = $("resultBox");
  const resultFileName = $("resultFileName");
  const downloadBtn = $("downloadBtn");
  const errorBox = $("errorBox");
  const errorText = $("errorText");

  let selectedFile = null;
  let resultBlob = null;
  let resultName = "";
  // 파일 선택 시 미리 분석해 둔 "현재 기본 차수"(N)와 "현재까지의 재확인 차수"(M).
  // 버튼 이름을 동적으로 표시하는 데만 쓰이고, 실제 변환 로직(processWorkbook)은 각 실행
  // 시점에 파일을 다시 분석하므로 이 값들에 의존하지 않는다.
  let detectedBaseRound = null;
  let detectedMaxRound = null;

  const DEFAULT_RECONFIRM_LABEL = "재확인 실행";
  const DEFAULT_NEXTBASE_LABEL = "다음 차수";

  // baseRound = 기본 차수(N), maxRound = 파일에 이미 존재하는 마지막 재확인 차수(M, 없으면 0).
  // [재확인 N차] 버튼은 항상 "N차+재확인(M+1)차" 형태로 표시한다 - 기본 차수(N)는 절대 바뀌지
  // 않고, 재확인 차수만 파일에 이미 있는 이력(M)을 기준으로 +1 된 값을 보여준다.
  //   - 재확인 이력이 아직 없는 기본 N차 파일(M=0): "N차+재확인1차"
  //   - 이미 "N차+재확인M차"까지 있는 파일: "N차+재확인(M+1)차"
  // [N+1차] 버튼은 재확인 이력과 무관하게 항상 기본 차수(N) 기준 다음 차수(N+1차)만 표시한다.
  function setRunButtonLabels(baseRound, maxRound) {
    if (typeof baseRound === "number" && !isNaN(baseRound)) {
      const currentMaxRound = typeof maxRound === "number" && !isNaN(maxRound) ? maxRound : 0;
      const nextReconfirmRound = currentMaxRound + 1;
      reconfirmBtn.textContent = `${baseRound}차+재확인${nextReconfirmRound}차`;
      nextBaseBtn.textContent = `${baseRound + 1}차`;
    } else {
      reconfirmBtn.textContent = DEFAULT_RECONFIRM_LABEL;
      nextBaseBtn.textContent = DEFAULT_NEXTBASE_LABEL;
    }
  }

  function setRunButtonsDisabled(disabled) {
    reconfirmBtn.disabled = disabled;
    nextBaseBtn.disabled = disabled;
  }

  function setStatus(text) {
    statusEl.textContent = "상태: " + text;
  }

  function showError(msg) {
    errorBox.style.display = "block";
    errorText.textContent = msg;
    setStatus("오류 발생");
    setRunButtonsDisabled(!selectedFile);
  }

  function clearError() {
    errorBox.style.display = "none";
    errorText.textContent = "";
  }

  function appendLog(lines) {
    for (const line of lines) {
      const div = document.createElement("div");
      div.className = line.startsWith("[경고]") ? "log-warn" : "log-line";
      div.textContent = line;
      logEl.appendChild(div);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtDateDot(d) {
    return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}`;
  }

  // 원본 파일명 안의 "(YYYY.MM.DD~)" 날짜 부분만 오늘 날짜로 교체한다.
  // 그 외 프로젝트명/기능명/차수 등 나머지 문자열은 절대 손대지 않는다.
  // 파일명에서 해당 패턴을 찾지 못한 경우에만(예외적인 경우) 기존 방식(뒤에 _재확인_날짜 추가)으로 대체한다.
  const DATE_TAG_RE = /\((\d{4})\.(\d{2})\.(\d{2})~\)/;

  // [N+1차] 변환일 때만 파일명 안의 기본 차수 표기("N차")를 "(N+1)차"로 바꾼다. 파일 선택 시
  // 이미 분석해 둔 실제 기본 차수(baseRound, detectCurrentRound 결과 - 버튼 라벨과 동일한 값)를
  // 기준으로 정확히 그 숫자+차 토큰만 찾아 바꾸고, 그 외 숫자나 문자열은 전혀 건드리지 않는다.
  // (예: baseRound=2 → 파일명 안의 "2차" 만 "3차"로. 다른 숫자가 우연히 있어도 무관하게 둔다.)
  // baseRound 를 알 수 없거나(감지 실패) 파일명에서 "N차" 형태의 토큰을 찾지 못하면 원본 그대로 둔다
  // (하드코딩/추측 금지 - 확실한 경우에만 바꾼다).
  function bumpRoundInFilename(name, baseRound) {
    if (typeof baseRound !== "number" || isNaN(baseRound)) return name;
    const target = String(baseRound);
    const tokenRe = /(^|\D)(\d+)차(?!\d)/g;
    let m;
    let found = null;
    while ((m = tokenRe.exec(name))) {
      if (m[2] === target) {
        found = m;
        break;
      }
    }
    if (!found) return name;
    const digitsStart = found.index + found[1].length;
    const digitsEnd = digitsStart + found[2].length + "차".length;
    const nextRound = baseRound + 1;
    return name.slice(0, digitsStart) + `${nextRound}차` + name.slice(digitsEnd);
  }

  // mode: "reconfirm"(기존과 완전히 동일 - 파일명의 차수 표기는 절대 바꾸지 않음, 날짜만 갱신)
  //     | "nextBase"(파일명 안의 기본 차수 표기도 N차 -> (N+1)차 로 함께 바꾼 뒤 날짜를 갱신)
  function buildOutputName(originalName, runDate, mode, baseRound) {
    const dateStr = fmtDateDot(runDate);
    const name = mode === "nextBase" ? bumpRoundInFilename(originalName, baseRound) : originalName;
    if (DATE_TAG_RE.test(name)) {
      return name.replace(DATE_TAG_RE, `(${dateStr}~)`);
    }
    const dot = name.lastIndexOf(".");
    const base = dot >= 0 ? name.slice(0, dot) : name;
    const ext = dot >= 0 ? name.slice(dot) : ".xlsx";
    return `${base}_재확인_${dateStr}${ext}`;
  }

  // 파일 선택 버튼과 드래그 앤 드롭이 공유하는 단일 처리 경로.
  // (버튼으로 골랐든 드롭했든 이후 동작은 완전히 동일해야 하므로 한 함수로 통일한다.)
  async function handleSelectedFile(f) {
    clearError();
    resultBox.style.display = "none";
    logEl.innerHTML = "";
    detectedBaseRound = null;
    detectedMaxRound = null;
    setRunButtonLabels(null);
    if (!f) return;
    if (!/\.xlsx$/i.test(f.name)) {
      showError("지원하지 않는 파일 형식입니다. .xlsx 파일을 선택해 주세요.");
      fileInput.value = "";
      selectedFile = null;
      fileNameEl.textContent = "(선택된 파일 없음)";
      setRunButtonsDisabled(true);
      return;
    }
    selectedFile = f;
    fileNameEl.textContent = f.name;
    setRunButtonsDisabled(false);
    setStatus("파일 분석 중...");

    // 버튼 이름을 위해 "현재 기본 차수"만 가볍게 미리 읽어본다. 실패하거나 값을 얻지 못해도
    // 버튼은 기본 문구로 그대로 활성화되며(실제 변환 시 다시 처음부터 분석하므로 무관), 이 단계의
    // 오류는 조용히 무시한다 - 파일 선택 자체를 막아서는 안 된다.
    try {
      const buf = await f.arrayBuffer();
      const info = await window.ExcelReconfirm.detectCurrentRound(buf, window.JSZip);
      if (selectedFile !== f) return; // 그 사이 다른 파일이 선택된 경우 무시
      detectedBaseRound = info ? info.baseRound : null;
      detectedMaxRound = info ? info.currentMaxRound : null;
      setRunButtonLabels(detectedBaseRound, detectedMaxRound);
      setStatus("대기 중 (버튼을 눌러 실행해 주세요)");
    } catch (e) {
      if (selectedFile !== f) return;
      detectedMaxRound = null;
      setRunButtonLabels(null);
      setStatus("대기 중 (버튼을 눌러 실행해 주세요)");
    }
  }

  pickBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    handleSelectedFile(f);
  });

  // ---- 드래그 앤 드롭 (기존 파일 선택 버튼은 그대로 유지, 추가 방식으로 제공) ----
  const dropZone = $("dropZone");
  if (dropZone) {
    let dragCounter = 0;

    const setDragActive = (active) => {
      dropZone.classList.toggle("drag-active", active);
    };

    dropZone.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragCounter++;
      setDragActive(true);
    });
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
    });
    dropZone.addEventListener("dragleave", (e) => {
      e.preventDefault();
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) setDragActive(false);
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCounter = 0;
      setDragActive(false);
      const dt = e.dataTransfer;
      const f = dt && dt.files && dt.files[0];
      if (!f) return;
      // 드롭된 파일을 fileInput 에도 반영해 이후 로직(값 초기화 등)이 완전히 동일하게 동작하도록 한다.
      try {
        const dtObj = new DataTransfer();
        dtObj.items.add(f);
        fileInput.files = dtObj.files;
      } catch (err) {
        // 일부 구형 브라우저는 DataTransfer 생성자를 지원하지 않을 수 있음 - fileInput 동기화만 생략
      }
      handleSelectedFile(f);
    });
  }

  // [재확인 N차] 버튼과 [N+1차] 버튼이 공유하는 단일 실행 경로.
  // 두 버튼 모두 "행/열 추가 + 기존 값 유지" 구조는 processWorkbook 내부에서 완전히 동일하게
  // 처리되며, mode 값만 다르게 넘겨 새로 추가되는 문구만 갈라지도록 한다(공통 로직 재사용).
  async function runConversion(mode) {
    clearError();
    resultBox.style.display = "none";
    logEl.innerHTML = "";
    if (!selectedFile) {
      showError("Excel 파일을 먼저 선택해 주세요.");
      return;
    }
    setRunButtonsDisabled(true);
    pickBtn.disabled = true;
    setStatus("변환 진행 중...");
    try {
      const buf = await selectedFile.arrayBuffer();
      let zipCheck;
      try {
        zipCheck = await window.JSZip.loadAsync(buf);
      } catch (e) {
        throw new Error("Excel 파일을 열 수 없습니다. 파일이 손상되었거나 올바른 xlsx 형식이 아닙니다.");
      }
      const runDate = new Date();
      const { zip, log } = await window.ExcelReconfirm.processWorkbook(buf, window.JSZip, { date: runDate, mode });
      appendLog(log);
      setStatus("결과 파일 생성 중...");
      const blob = await zip.generateAsync({ type: "blob" });

      // 결과 파일 재검증: 정상적으로 다시 열리는지 확인
      setStatus("결과 파일 검증 중...");
      try {
        const verifyBuf = await blob.arrayBuffer();
        const verifyZip = await window.JSZip.loadAsync(verifyBuf);
        const requiredPaths = ["xl/workbook.xml", "xl/sharedStrings.xml", "xl/styles.xml"];
        for (const p of requiredPaths) {
          if (!verifyZip.file(p)) throw new Error("필수 구성 파일 누락: " + p);
        }
      } catch (ve) {
        throw new Error("결과 파일 생성에 실패했습니다 (검증 실패): " + ve.message);
      }

      resultBlob = blob;
      resultName = buildOutputName(selectedFile.name, runDate, mode, detectedBaseRound);
      resultFileName.textContent = resultName;
      resultBox.style.display = "block";
      setStatus("완료되었습니다.");
    } catch (e) {
      console.error(e);
      showError((e && e.message) ? e.message : String(e));
      setStatus("오류로 중단됨");
    } finally {
      pickBtn.disabled = false;
      setRunButtonsDisabled(!selectedFile);
    }
  }

  reconfirmBtn.addEventListener("click", () => runConversion("reconfirm"));
  nextBaseBtn.addEventListener("click", () => runConversion("nextBase"));

  downloadBtn.addEventListener("click", () => {
    if (!resultBlob) return;
    const url = URL.createObjectURL(resultBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = resultName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
})();

</script>
